name: Validação

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skills e manifestos
        run: node .github/scripts/validate.mjs
      - name: Scripts
        run: shellcheck skills/*/scripts/*.sh
